name: Life OS cron

# Runs hourly and decides for itself what to do based on UK local time, so BST
# and GMT never shift the schedule. GitHub's cron can drift 5-15 minutes; that
# is fine for a "you haven't logged today" nudge.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force_reminder:
        description: 'Send the reminder regardless of the hour (for testing)'
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync calendar and send reminders
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_REFRESH_TOKEN }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
          GOOGLE_ICAL_URL: ${{ secrets.GOOGLE_ICAL_URL }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
          FORCE_REMINDER: ${{ inputs.force_reminder }}
        run: node scripts/cron.mjs
