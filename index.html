<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life OS</title>
<meta name="theme-color" content="#0B0A09">
<meta name="description" content="One app that tracks everything.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark">L</span>
      <span class="brand-name">Life OS</span>
    </div>
    <nav id="sidenav" class="sidenav"></nav>
  </aside>

  <div id="frame">
    <header id="top">
      <div class="top-left">
        <h1 id="view-title">Today</h1>
        <p id="view-sub"></p>
      </div>
      <div class="top-right">
        <button id="sync-chip" class="chip" type="button">
          <span class="dot" id="sync-dot"></span><span id="sync-text">Local only</span>
        </button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav id="tabbar"></nav>
</div>

<div id="sheet-scrim" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="More">
  <div class="sheet-grab"></div>
  <div id="sheet-items" class="sheet-items"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
